<svg width="300" height="155" viewBox="0 0 300 155" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="2" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="155" rx="12" fill="url(#bgGradient)" />
  
  <!-- Decorative circles -->
  <circle cx="260" cy="30" r="40" fill="#10b981" fill-opacity="0.05" />
  <circle cx="40" cy="120" r="30" fill="#3b82f6" fill-opacity="0.05" />
  
  <!-- Main Text -->
  <text x="50%" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="24" fill="#ffffff" filter="url(#shadow)">
    Electron Template
  </text>
  
  <!-- Subtext -->
  <text x="50%" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">
    Vue 3 + Vite + Electron
  </text>
  
  <!-- Divider -->
  <rect x="75" y="115" width="150" height="2" rx="1" fill="#10b981" fill-opacity="0.5" />
  
  <!-- Bottom Accent -->
  <path d="M0 143 Q 150 135 300 143 L 300 155 L 0 155 Z" fill="#10b981" fill-opacity="0.2" />
</svg>
